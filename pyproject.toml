[project]
name = "iv-desk"
version = "0.1.0"
description = "Autonomous options desk trading the volatility risk premium on Alpaca"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",            # market-data REST reads (marketdata.py)
    "numpy>=1.26",            # signal maths (signal.py)
    "python-dotenv>=1.0",     # .env loading
    "openai>=1.40",           # LLM desk — every seat runs on Featherless (OpenAI-compatible)
    "tzdata>=2024.1",         # ZoneInfo("America/New_York") — no system tz db on Windows / slim CI
]
# Removed 2026-08-30 (issue #15): alpaca-py (order path is the Alpaca CLI, not the SDK),
# pandas / scipy (signal.py uses numpy only), pydantic and rich (unused), and the paid-LLM SDK —
# the desk runs 100% on Featherless since #31, so there is no out-of-pocket spend.

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["DTZ011"]  # date.today() is intentional for expiration-date matching (exchange local date)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408", "S101", "SLF001"]  # dict() reads clearer in fixtures; asserts and _private are the point

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
