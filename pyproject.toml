[project]
name = "iv-desk"
version = "0.1.0"
description = "Autonomous options desk trading the volatility risk premium on Alpaca"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "rich>=13.7",
    "anthropic>=0.40",
    "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["DTZ011"]  # date.today() is intentional for expiration-date matching (exchange local date)

[tool.pytest.ini_options]
testpaths = ["agent", "tests"]
