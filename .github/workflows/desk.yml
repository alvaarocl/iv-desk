name: IV Desk loop

on:
  schedule:
    # Every 15 min, 13:30–20:15 UTC, Mon–Fri (~09:30–16:15 ET). GitHub cron is best-effort and
    # can be delayed or skipped under load — the loop is built to tolerate a missed run
    # (reconcile on start, exit window opens at 15:30 ET). See docs/RUNBOOK.md.
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      # `inherit` (the default) falls through to the DESK_MODE repo variable. A `type: choice`
      # input ALWAYS carries its default on a dispatch, so the previous `default: dry_run` made
      # `github.event.inputs.mode` permanently truthy and `vars.DESK_MODE` unreachable from any
      # manual or scripted dispatch — a dispatched session would silently run dry_run while the
      # repo variable said live, and `gh variable set DESK_MODE exits_only` (the documented kill
      # switch) would not reach it either. The variable has to stay the single source of truth.
      mode:
        description: "inherit = use the DESK_MODE repo variable"
        default: "inherit"
        type: choice
        options: [inherit, dry_run, live, exits_only]

concurrency:
  group: desk-loop
  cancel-in-progress: false

permissions:
  contents: write
  # Needed only to dispatch pages.yml explicitly from the "Deploy dashboard" step below — see
  # its comment for why `git push` alone was never enough.
  actions: write

env:
  # Pinned — alpacahq/cli is an alpha preview whose flags/output "may change without notice".
  ALPACA_CLI_VERSION: "0.0.14"

jobs:
  run:
    runs-on: ubuntu-latest
    # The loop is a ~1-2 min job; the debate has its own wall-clock budget. Cap it so a hung run
    # cannot sit on the `desk-loop` concurrency group for the rest of the session.
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_ACCOUNT_ID: ${{ vars.ALPACA_ACCOUNT_ID }}
      # LLM desk — Featherless only (Anthropic dropped: no out-of-pocket spend).
      FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
      FEATHERLESS_MODELS: ${{ vars.FEATHERLESS_MODELS }}
      # An unset repo variable arrives as "" (not absent), so os.environ.get's default never
      # fires — the fallback has to live here too. debate.py also treats "" as absent.
      FEATHERLESS_BASE_URL: ${{ vars.FEATHERLESS_BASE_URL || 'https://api.featherless.ai/v1' }}
      # empty = Bull/Bear/Desk Head reuse the first FEATHERLESS_MODELS entry (see agent/debate.py)
      FEATHERLESS_ARGUER_MODEL: ${{ vars.FEATHERLESS_ARGUER_MODEL }}
      # `off` bypasses the seats and passes the deterministic decision through — the escape hatch
      # if Featherless is down mid-session. Set via repo variable, no YAML edit needed.
      DESK_DEBATE: ${{ vars.DESK_DEBATE || 'required' }}
      DESK_DEBATE_BUDGET_S: ${{ vars.DESK_DEBATE_BUDGET_S || '90' }}
      # An explicit dispatch input wins; `inherit` and `schedule` both fall through to the repo
      # variable; anything unrecognised is mapped to dry_run by config.desk_mode() anyway.
      DESK_MODE: >-
        ${{ (github.event.inputs.mode != 'inherit' && github.event.inputs.mode)
            || vars.DESK_MODE || 'dry_run' }}
      ALPACA_CLI_BIN: alpaca
    steps:
      - uses: actions/checkout@v4

      - name: Cache Alpaca CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/alpaca
          key: alpaca-cli-${{ env.ALPACA_CLI_VERSION }}-linux-amd64

      - name: Install Alpaca CLI (pinned)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          v="${ALPACA_CLI_VERSION}"
          url="https://github.com/alpacahq/cli/releases/download/v${v}/cli_${v}_linux_amd64.tar.gz"
          curl -sSL --fail "$url" -o /tmp/alpaca.tgz
          tar -xzf /tmp/alpaca.tgz -C /tmp
          install -m 0755 /tmp/alpaca ~/.local/bin/alpaca

      - name: Verify CLI version
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          got="$("$HOME/.local/bin/alpaca" version 2>&1 | tr -d '[:space:]')"
          echo "alpaca CLI reports: $got"
          test "$got" = "${ALPACA_CLI_VERSION}" || { echo "::error::CLI version mismatch"; exit 1; }

      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen

      - name: Run desk loop
        run: uv run python -m agent.desk

      - name: Persist journal
        id: persist
        if: always()
        run: |
          set -euo pipefail
          git config user.name "iv-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          git commit -m "loop $(date -u +%FT%TZ)"
          # Rebase onto any concurrent commit before pushing; retry once. A lost push would make
          # the agent forget open positions, so this must not be best-effort (issue #3, #23).
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "push attempt $attempt failed; retrying"; sleep 5
          done
          echo "::error::could not persist journal after 3 attempts"; exit 1

      - name: Deploy dashboard
        # `git push` above authenticates with the ephemeral GITHUB_TOKEN, and GitHub deliberately
        # does not let a push made with that token trigger another workflow's `on: push` — the
        # anti-recursion rule that (until this fix) silently kept pages.yml from ever redeploying
        # off the loop's own commits, despite its `paths: data/**` trigger looking correct on
        # paper. Every "loop" commit for 3 days pushed real data and never once woke pages.yml;
        # the dashboard only moved on a human-authored push (e.g. a PR merge). An explicit
        # `workflow_dispatch` API call is a different mechanism from a push event, so it isn't
        # subject to that restriction — it just needs `actions: write` on this job's token.
        if: always() && steps.persist.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}"
